<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="900" viewBox="0 0 2200 900">
  <style>
    .title { font: bold 26px Arial; fill: #17324d; }
    .layer { font: bold 18px Arial; fill: #17324d; }
    .label { font: 15px Arial; fill: #17202a; }
    .small { font: 13px Arial; fill: #17202a; }
    .business { fill: #f8d7a8; stroke: #a66a14; stroke-width: 2; }
    .application { fill: #b9d7f0; stroke: #286090; stroke-width: 2; }
    .data { fill: #d9ead3; stroke: #38761d; stroke-width: 2; }
    .store { fill: #eeeeee; stroke: #666666; stroke-width: 2; }
    .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .serving { stroke: #4b5563; stroke-width: 1.5; fill: none; marker-end: url(#smallArrow); }
    .bus { stroke: #4b5563; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4b5563"/>
